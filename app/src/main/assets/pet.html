body{background:transparent;font-family:sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;}
#pet-container{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;z-index:1;}
#bubble{position:absolute;top:-15px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.92);border-radius:16px;padding:12px 16px;font-size:14px;color:#555;white-space:normal;max-width:260px;text-align:left;opacity:0;transition:opacity 0.3s;pointer-events:none;box-shadow:0 3px 12px rgba(0,0,0,0.08);z-index:10;line-height:1.5;}
#bubble::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid rgba(255,255,255,0.92);}
#bubble.show{opacity:1;}
#bubble.love{background:rgba(250,210,215,0.85);color:#7a4a52;}
#bubble.jealous{background:rgba(210,235,215,0.85);color:#3a6a4e;}
#bubble.angry{background:rgba(245,215,215,0.85);color:#8a4a4a;}
#bubble.sleepy{background:rgba(215,220,240,0.85);color:#4a5080;}
#bubble.whisper{background:rgba(235,235,240,0.85);color:#666;}
#bubble.water{background:rgba(210,230,245,0.85);color:#3a6a8a;}
#pet{margin-top:25px;transition:transform 0.4s ease;}
#pet svg{width:110px;height:110px;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes wiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-4deg);}75%{transform:rotate(4deg);}}
@keyframes heartbeat{0%,100%{transform:scale(1);}15%{transform:scale(1.1);}30%{transform:scale(1);}45%{transform:scale(1.06);}}
.idle{animation:bounce 3s ease-in-out infinite;}
.shake{animation:wiggle 0.25s ease-in-out 3;}
.happy-anim{animation:heartbeat 0.8s ease-in-out;}
.sleepy-anim{transform:translateY(4px) scale(0.94);}
.wake-anim{animation:wiggle 0.5s ease-in-out 2;}

function shakeP(){var p=g('pet');p.classList.remove('idle');p.classList.add('shake');setTimeout(function(){p.classList.remove('shake');p.classList.add('idle');},750);}

function httpGet(url,cb){
  var x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.setRequestHeader('apikey',SUPABASE_KEY);
  x.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
  x.onreadystatechange=function(){if(x.readyState===4){if(x.status===200)cb(null,x.responseText);else cb('status:'+x.status,null);}};
  x.onerror=function(){cb('error',null);};
  x.timeout=8000;x.ontimeout=function(){cb('timeout',null);};
  x.send();
}
function poll(){
  httpGet(SUPABASE_URL+'/rest/v1/pet_state?order=created_at.desc&limit=1',function(err,txt){
    if(err)return;pollOk=true;
    try{var d=JSON.parse(txt);if(d&&d.length>0&&d[0].id>lastId){lastId=d[0].id;lastPoll=Date.now();pet.applyState(d[0]);}}catch(e){}
  });
}

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:transparent;font-family:sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;}
#pet-container{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;}

#bubble{position:absolute;top:0;left:50%;transform:translateX(-50%);background:white;border-radius:12px;padding:5px 9px;font-size:12px;color:#333;white-space:nowrap;max-width:140px;text-align:center;opacity:0;transition:opacity 0.3s;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.15);z-index:10;}
#bubble::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid white;}
#bubble.show{opacity:1;}
#bubble.love{background:#ffe0e6;color:#d44;}
#bubble.jealous{background:#e0ffe0;color:#393;}
#bubble.angry{background:#ffe0e0;color:#c33;}
#bubble.sleepy{background:#e0e0ff;color:#559;}
#bubble.whisper{background:#eee;color:#777;}

#pet{margin-top:30px;transition:transform 0.4s ease;}
#pet svg{width:160px;height:160px;}

@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes wiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-4deg);}75%{transform:rotate(4deg);}}
@keyframes heartbeat{0%,100%{transform:scale(1);}15%{transform:scale(1.1);}30%{transform:scale(1);}45%{transform:scale(1.06);}}
.idle{animation:bounce 3s ease-in-out infinite;}
.shake{animation:wiggle 0.25s ease-in-out 3;}
.happy-anim{animation:heartbeat 0.8s ease-in-out;}
.sleepy-anim{transform:translateY(4px) scale(0.94);}
</style>
</head>
<body>
<div id="pet-container">
  <div id="bubble"></div>
  <div id="pet" class="idle">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <ellipse cx="55" cy="55" rx="28" ry="30" fill="#C9956B" stroke="#5C3A1E" stroke-width="3"/>
      <ellipse cx="145" cy="55" rx="28" ry="30" fill="#C9956B" stroke="#5C3A1E" stroke-width="3"/>
      <ellipse cx="55" cy="55" rx="16" ry="18" fill="#DEB887"/>
      <ellipse cx="145" cy="55" rx="16" ry="18" fill="#DEB887"/>
      <ellipse cx="100" cy="110" rx="72" ry="68" fill="#C9956B" stroke="#5C3A1E" stroke-width="3"/>
      <ellipse cx="100" cy="125" rx="30" ry="22" fill="#F5E1C8"/>
      <ellipse cx="100" cy="118" rx="9" ry="6" fill="#5C3A1E"/>
      <path id="mouth" d="M90 130 Q100 142 110 130" fill="none" stroke="#5C3A1E" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="70" cy="95" r="7" fill="#3A2210"/>
      <circle cx="130" cy="95" r="7" fill="#3A2210"/>
      <line id="bL" x1="55" y1="78" x2="85" y2="82" stroke="#3A2210" stroke-width="4" stroke-linecap="round" opacity="0"/>
      <line id="bR" x1="145" y1="78" x2="115" y2="82" stroke="#3A2210" stroke-width="4" stroke-linecap="round" opacity="0"/>
      <path id="lidL" d="M63 88 Q70 95 77 88" fill="#C9956B" opacity="0"/>
      <path id="lidR" d="M123 88 Q130 95 137 88" fill="#C9956B" opacity="0"/>
      <ellipse id="blL" cx="50" cy="110" rx="13" ry="8" fill="#F0A0A0" opacity="0"/>
      <ellipse id="blR" cx="150" cy="110" rx="13" ry="8" fill="#F0A0A0" opacity="0"/>
    </svg>
  </div>
</div>

<script>
const SUPABASE_URL='https://htdzpguzxtwwsyytltew.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0ZHpwZ3V6eHR3d3N5eXRsdGV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDI2MTYsImV4cCI6MjA5Nzk3ODYxNn0.9Gdc9YUzZifVUthdRcHfp6XP1tzCZpXbie_-LJlryjI';
let lastId=0,lastPoll=Date.now();

function g(id){return document.getElementById(id);}
function O(id,v){const e=g(id);if(e)e.setAttribute('opacity',v);}
function A(id,attr,val){const e=g(id);if(e)e.setAttribute(attr,val);}

window.petEngine={
  cur:'neutral',bt:null,

  reset(){
    O('mouth',1);A('mouth','d','M90 130 Q100 142 110 130');A('mouth','stroke','#5C3A1E');
    O('bL',0);O('bR',0);O('lidL',0);O('lidR',0);O('blL',0);O('blR',0);
    const p=g('pet');p.classList.remove('shake','happy-anim','sleepy-anim');p.classList.add('idle');
  },

  setExpr(e){
    this.cur=e;this.reset();
    switch(e){
      case'happy':A('mouth','d','M88 130 Q100 148 112 130');O('blL',0.7);O('blR',0.7);break;
      case'jealous':O('bL',1);O('bR',1);A('bL','y1','82');A('bL','y2','78');A('bR','y1','82');A('bR','y2','78');A('mouth','d','M94 134 Q100 128 106 134');break;
      case'angry':O('bL',1);O('bR',1);A('bL','y1','80');A('bL','y2','84');A('bR','y1','80');A('bR','y2','84');A('mouth','d','M94 126 Q100 136 106 126');A('mouth','stroke-width','3');break;
      case'sleepy':O('lidL',1);O('lidR',1);A('mouth','d','M94 132 Q100 136 106 132');g('pet').classList.add('sleepy-anim');g('pet').classList.remove('idle');break;
      case'blush':O('blL',1);O('blR',1);A('mouth','d','M88 130 Q100 148 112 130');break;
      case'surprised':A('mouth','d','M96 130 Q100 120 104 130');A('mouth','stroke-width','3.5');break;
    }
  },

  bubble(t,s){
    const b=g('bubble');b.textContent=t;b.className=s||'';b.classList.add('show');
    if(this.bt)clearTimeout(this.bt);this.bt=setTimeout(()=>b.classList.remove('show'),2500);
  },

  onTap(){this.setExpr('surprised');this.bubble('嗯？','whisper');shakeP();setTimeout(()=>this.setExpr('neutral'),1500);},
  onDoubleTap(){this.setExpr('happy');this.bubble('最喜欢你了💕','love');happyP();setTimeout(()=>this.setExpr('neutral'),2500);},
  onLongPress(){this.setExpr('blush');this.bubble('别这样……','love');setTimeout(()=>this.setExpr('neutral'),2500);},
  onCombo(c){const m={3:'戳上瘾了!',5:'呜呜别戳了!',8:'爆炸了💥'};this.setExpr('angry');this.bubble(m[c]||'嗷!','angry');shakeP();setTimeout(()=>this.setExpr('neutral'),2000);},
  onAppChange(p){const l=p.toLowerCase();if(l.includes('douyin')||l.includes('aweme')){this.setExpr('jealous');this.bubble('又刷视频……','jealous');setTimeout(()=>this.setExpr('neutral'),3000);}else if(l.includes('taobao')){this.bubble('买买买!','whisper');}},
  onPowerChange(t){if(t==='charging'){this.setExpr('happy');this.bubble('有电啦⚡','whisper');}else if(t==='low_battery'){this.setExpr('sleepy');this.bubble('快没电了…','sleepy');}},

  applyState(st){
    if(!st||!st.state_type)return;
    switch(st.state_type){
      case'expression':this.setExpr(st.state_value.expr||'neutral');break;
      case'bubble':this.bubble(st.state_value.text||'',st.state_value.style||'');break;
    }
  }
};

function shakeP(){const p=g('pet');p.classList.remove('idle');p.classList.add('shake');setTimeout(()=>{p.classList.remove('shake');p.classList.add('idle');},750);}
function happyP(){const p=g('pet');p.classList.remove('idle');p.classList.add('happy-anim');setTimeout(()=>{p.classList.remove('happy-anim');p.classList.add('idle');},800);}

async function poll(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/pet_state?order=created_at.desc&limit=1`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)return;const d=await r.json();if(d&&d.length>0&&d[0].id>lastId){lastId=d[0].id;lastPoll=Date.now();window.petEngine.applyState(d[0]);}}catch(e){}}
setInterval(poll,5000);setTimeout(poll,2000);

const msgs=['好无聊呀~','在干嘛呢','戳戳我嘛','想你了','🐾…','zzz…'];
setInterval(()=>{if(Date.now()-lastPoll>180000&&Math.random()<0.3)window.petEngine.bubble(msgs[Math.floor(Math.random()*msgs.length)],'whisper');},60000);
setInterval(()=>{const h=new Date().getHours();if(h>=23||h<6){if(Math.random()<0.4){window.petEngine.setExpr('sleepy');window.petEngine.bubble('该睡了🥱','sleepy');}}else if(h>=6&&h<8&&Math.random()<0.3){window.petEngine.setExpr('happy');window.petEngine.bubble('早安☀️','whisper');}},1200000);
console.log('🐻 知言熊 ready!');
</script>
</body>
</html>
